<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Tienda de ropa</title>
    <link rel="stylesheet" href="Fb.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>Bienvenido</h1>
            <p class="sub">Inicia sesión en nuestra tienda</p>
        </header>

        <form id="loginForm">

            <input 
                type="email" 
                id="correo" 
                placeholder="Correo electrónico" 
                required
            >

            <input 
                type="password" 
                id="contrasena" 
                placeholder="Contraseña" 
                required
            >

            <button type="submit">Iniciar sesión</button>

        </form>

        <p id="mensaje"></p>

    </div>

    <script src="sesion.js"></script>

</body>
</html>
